<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='/favicon.ico') }}">
    <title>{% block title %}Task Master Pro{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link href="{{ url_for('static', path='/css/style.css') }}" rel="stylesheet">
    
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container nav-wrapper">
            <div class="logo-group">
                <a href="/" class="logo">Task Master <span>Pro</span></a>
                
                <div class="theme-switch-wrapper">
                    <span class="mode-icon">🌙</span> 
                    <label class="theme-switch" for="checkbox">
                        <input type="checkbox" id="checkbox" />
                        <div class="slider round"></div>
                    </label>
                    <span class="mode-icon">☀️</span> 
                </div>
            </div>
        
            <div id="auth-links">
                {% if user %}
                    <span style="margin-right: 15px; color: var(--primary);">👋 {{ user.username }}</span>
                    <a href="/logout" class="nav-link btn-logout-nav">Изход</a>
                {% else %}
                    <a href="/login" class="nav-link">Вход</a>
                    <a href="/register" class="nav-link btn-outline">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Task Master Pro. Built with FastAPI & Wit.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
    <script>
        const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
        const currentTheme = localStorage.getItem('theme');
        
        // Проверка при зареждане
        if (currentTheme) {
            document.body.classList.toggle('dark-mode', currentTheme === 'dark');
            if (currentTheme === 'dark') {
                toggleSwitch.checked = true;
            }
        }

        function switchTheme(e) {
            if (e.target.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
            }    
        }

        toggleSwitch.addEventListener('change', switchTheme, false);
    </script>
</body>
</html>
